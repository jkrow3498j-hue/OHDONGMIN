  <title>동민게시판 마커 클러스터링 대시보드</title>

  <!-- Leaflet CSS -->

    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

  />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
      padding: 4px;
    }

    .leaflet-popup-content {
      margin: 12px;
      line-height: 1.5;
    }

    .marker-cluster {
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker-cluster div {
      width: 32px;
      height: 32px;
      margin: 4px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .22);
    }

    .marker-cluster-small { background: rgba(99,102,241,.25); }
    .marker-cluster-small div { background: rgb(79,70,229); }

    .marker-cluster-medium { background: rgba(168,85,247,.25); }
    .marker-cluster-medium div { background: rgb(147,51,234); }

    .marker-cluster-large { background: rgba(236,72,153,.25); }
    .marker-cluster-large div { background: rgb(219,39,119); }

    .board-marker {
      background: transparent;
      border: 0;
    }

    @media (max-width: 767px) {
      body { overflow: auto; }
    }
  </style>
</head>

      { id: "범1-3", location: "범일1동민원센터(범곡로 14)", lat: 35.139612, lon: 129.062024 },
      { id: "범1-4", location: "대근아트빌라 앞(범곡남로16번길 1)", lat: 35.137839, lon: 129.058284 },
      { id: "범1-5", location: "정화가스 앞(증산로 125)", lat: 35.138766, lon: 129.060599 },
      { id: "범1-6", location: "달마정사 앞(증산동로 65-4)", lat: 35.139414, lon: 129.056086 },
      { id: "범1-7", location: "희야식당 옆(망양로886번길 3)", lat: 35.142345, lon: 129.058253 },
      { id: "범1-8", location: "동양알미늄 앞(증산서로 36)", lat: 35.136585, lon: 129.058097 },
      { id: "범1-9", location: "범일초등학교 테니스장 옆(증산서로 48-1)", lat: 35.143521, lon: 129.061763 },
      { id: "범1-10", location: "성일교회 밑(증산서로62번길 3)", lat: 35.140061, lon: 129.062402 },
      { id: "범1-11", location: "동신탕 옆(증산로 162)", lat: 35.138853, lon: 129.061955 },
      { id: "범1-12", location: "삼광주택 옆(증산로 167-1)", lat: 35.141703, lon: 129.061928 },
      { id: "범1-13", location: "가랑커피숖 옆(범곡북로 11)", lat: 35.139369, lon: 129.057812 },
      { id: "범1-14", location: "대양슈퍼옆 골목(범곡북로 21)", lat: 35.143714, lon: 129.061730 },
      { id: "범1-15", location: "동부전공회 맞은편(범상로 24 앞)", lat: 35.143219, lon: 129.057639 },
      { id: "범1-16", location: "호천경로당 앞(범곡로 43)", lat: 35.140130, lon: 129.060417 },
      { id: "범1-17", location: "범일4동어린이집옆(범곡북로 26)", lat: 35.141604, lon: 129.064562 },
      { id: "범1-18", location: "하루방 옆 온천교회(범내남로 3-2)", lat: 35.140683, lon: 129.061327 },
      { id: "범1-19", location: "좌천슈퍼 앞(범내남로 16-1)", lat: 35.144416, lon: 129.058721 },
      { id: "범1-20", location: "성화미용실 옆(범내남로 42-3)", lat: 35.142071, lon: 129.060010 },
      { id: "범1-21", location: "동구종합사회복지관앞(안창로 57)", lat: 35.139634, lon: 129.060288 },
      { id: "범1-22", location: "삼거리가든 옆(안창로77번길 4)", lat: 35.138243, lon: 129.059298 },
      { id: "범1-23", location: "안창세탁소앞(안창로 92-1)", lat: 35.137699, lon: 129.061845 },
      { id: "범1-24", location: "교통부로타리옆(망양로 972)", lat: 35.141528, lon: 129.060309 },
      { id: "범1-25", location: "범일1동주민센터 옆(범상로 12)", lat: 35.136270, lon: 129.062013 },
      { id: "범2-1", location: "성남초등학교옆(범일로53번길 14)", lat: 35.144865, lon: 129.055938 },
      { id: "범2-2", location: "현대백화점 뒤편(범일일길 43-1)", lat: 35.140306, lon: 129.055030 },
      { id: "범2-3", location: "자성대아파트 D동 옆(자성로108번길 14)", lat: 35.143521, lon: 129.056024 },
      { id: "범2-4", location: "송이한복 옆(범일로611-42)", lat: 35.146206, lon: 129.055171 },
      { id: "범5-1", location: "동아제분 담벽 (화성자원 입구)", lat: 35.147255, lon: 129.055419 },
      { id: "범5-2", location: "수남경로당맞은편(충장대로289번길 17)", lat: 35.146608, lon: 129.053375 }
    ];

    const map = L.map("map", {
      zoomControl: false,
      preferCanvas: true
    });

    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 20
    }).addTo(map);

    const clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 45,
      zoomToBoundsOnClick: true,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      disableClusteringAtZoom: 18,
      chunkedLoading: true,
      iconCreateFunction(cluster) {
        const count = cluster.getChildCount();
        let sizeClass = "marker-cluster-small";

        if (count >= 15) {
          sizeClass = "marker-cluster-large";
        } else if (count >= 5) {
          sizeClass = "marker-cluster-medium";
        }

        return L.divIcon({
          html: `<div><span>${count}</span></div>`,
          className: `marker-cluster ${sizeClass}`,
          iconSize: L.point(40, 40)
        });
      }
    });

    const customIcon = L.divIcon({
      className: "board-marker",
      html: `
        <div class="relative w-8 h-8 flex items-center justify-center">
          <div class="absolute inset-0 bg-indigo-500 rounded-full opacity-30"></div>
          <div class="relative w-4 h-4 bg-indigo-600 border-2 border-white rounded-full shadow-md"></div>
        </div>
      `,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      popupAnchor: [0, -16]
    });

    const listContainer = document.getElementById("locationList");
    const totalCount = document.getElementById("totalCount");
    const resetButton = document.getElementById("resetButton");

    totalCount.textContent = boardData.length;

    const allLatLngs = [];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    boardData.forEach((board) => {
      const latLng = L.latLng(board.lat, board.lon);
      allLatLngs.push(latLng);

      const marker = L.marker(latLng, {
        icon: customIcon,
        title: `${board.id} - ${board.location}`
      });

      marker.bindPopup(`
        <div class="p-2 min-w-[220px]">
          <div class="flex items-center gap-1.5 text-[11px] font-bold text-indigo-600 mb-2 bg-indigo-50 px-2 py-1 rounded-md inline-flex border border-indigo-100">
            <i class="ph ph-hash"></i>
            ${escapeHtml(board.id)}
          </div>
          <div class="text-[13px] text-slate-700 font-medium leading-relaxed flex items-start gap-1.5">
            <i class="ph ph-map-pin text-slate-400 mt-0.5"></i>
            <span>${escapeHtml(board.location)}</span>
          </div>
        </div>
      `);

      clusterGroup.addLayer(marker);

      const listItem = document.createElement("button");
      listItem.type = "button";
      listItem.className =
        "w-full text-left group flex items-start gap-3 p-3 md:p-3.5 mb-2 rounded-xl border border-slate-100 bg-white hover:border-indigo-200 hover:bg-indigo-50/40 cursor-pointer transition-all duration-200 shadow-sm hover:shadow-md";

      listItem.innerHTML = `
        <div class="mt-0.5 bg-slate-100 group-hover:bg-indigo-100 group-hover:text-indigo-600 text-slate-400 w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 transition-colors">
          <i class="ph ph-map-pin-fill text-lg"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-slate-800 text-[13px]">
            ${escapeHtml(board.id)}
          </div>
          <div class="text-[12px] text-slate-500 mt-1 line-clamp-2">
            ${escapeHtml(board.location)}
          </div>
        </div>
        <div class="opacity-0 group-hover:opacity-100 text-indigo-400 transition-opacity self-center pr-1">
          <i class="ph ph-caret-right text-lg"></i>
        </div>
      `;

      listItem.addEventListener("click", () => {
        clusterGroup.zoomToShowLayer(marker, () => {
          map.panTo(marker.getLatLng(), { animate: true });
          marker.openPopup();
        });
      });

      listContainer.appendChild(listItem);
    });

    map.addLayer(clusterGroup);

    const allBounds = L.latLngBounds(allLatLngs);

    function showAllBoards(animate = false) {
      map.fitBounds(allBounds, {
        padding: [35, 35],
        animate,
        duration: 0.8
      });
      map.closePopup();
    }

    resetButton.addEventListener("click", () => showAllBoards(true));

    showAllBoards(false);

    setTimeout(() => map.invalidateSize(), 150);
    window.addEventListener("resize", () => map.invalidateSize());
  </script>
</body>
</html>
