<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>동민게시판 현황</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
                   "Apple SD Gothic Neo", Arial, sans-serif;
      color: #1e293b;
      background: #f8fafc;
    }

    .app {
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      box-shadow: 3px 0 14px rgba(15, 23, 42, 0.06);
      z-index: 10;
    }

    .header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid #f1f5f9;
      flex: 0 0 auto;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #9333ea);
      color: #fff;
      font-size: 24px;
      box-shadow: 0 5px 14px rgba(99, 102, 241, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .sub {
      margin-top: 5px;
      color: #64748b;
      font-size: 13px;
    }

    .stats {
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #f1f5f9;
      flex: 0 0 auto;
    }

    .stat-card {
      padding: 15px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .stat-label {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .stat-value {
      margin-top: 4px;
      color: #4f46e5;
      font-size: 30px;
      font-weight: 800;
    }

    .list-header {
      padding: 13px 20px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
    }

    .list-title {
      font-size: 14px;
      font-weight: 800;
    }

    .badge {
      padding: 4px 8px;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      color: #4f46e5;
      background: #eef2ff;
      font-size: 11px;
      font-weight: 700;
    }

    #locationList {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 12px 18px;
    }

    .list-item {
      width: 100%;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin: 0 0 8px;
      text-align: left;
      cursor: pointer;
      transition: .15s ease;
    }

    .list-item:hover {
      background: #f5f3ff;
      border-color: #c7d2fe;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
    }

    .list-id {
      font-size: 13px;
      font-weight: 800;
      color: #1e293b;
    }

    .list-location {
      margin-top: 5px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
    }

    .map-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      background: #e2e8f0;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 300px;
      z-index: 1;
    }

    .map-info {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 500;
      max-width: 280px;
      padding: 12px 14px;
      border: 1px solid rgba(226, 232, 240, .95);
      border-radius: 13px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 8px 20px rgba(15,23,42,.1);
      font-size: 12px;
      line-height: 1.5;
      color: #64748b;
    }

    .map-info strong {
      display: block;
      margin-bottom: 3px;
      color: #1e293b;
      font-size: 13px;
    }

    .reset-btn {
      position: absolute;
      right: 18px;
      bottom: 26px;
      z-index: 600;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      background: #4f46e5;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(79,70,229,.28);
    }

    .reset-btn:hover {
      background: #4338ca;
    }

    .board-pin {
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #4f46e5;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .35);
    }

    .board-icon {
      background: transparent;
      border: 0;
    }

    .marker-cluster-small {
      background: rgba(99, 102, 241, .30);
    }

    .marker-cluster-small div {
      background: #4f46e5;
      color: #fff;
    }

    .marker-cluster-medium {
      background: rgba(168, 85, 247, .30);
    }

    .marker-cluster-medium div {
      background: #9333ea;
      color: #fff;
    }

    .marker-cluster-large {
      background: rgba(236, 72, 153, .30);
    }

    .marker-cluster-large div {
      background: #db2777;
      color: #fff;
    }

    .marker-cluster div {
      font-weight: 800;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
    }

    .popup-id {
      display: inline-block;
      padding: 4px 7px;
      margin-bottom: 7px;
      border-radius: 7px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 11px;
      font-weight: 800;
    }

    .popup-location {
      max-width: 260px;
      color: #334155;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      body {
        overflow: hidden;
      }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 38dvh 62dvh;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #e2e8f0;
      }

      .header {
        padding: 12px 14px;
      }

      .header-icon {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      h1 {
        font-size: 17px;
      }

      .stats {
        padding: 9px 14px;
      }

      .stat-card {
        padding: 9px 12px;
      }

      .stat-value {
        font-size: 22px;
      }

      .list-header {
        padding: 9px 14px;
      }

      #locationList {
        padding: 8px 10px 14px;
      }

      .list-item {
        padding: 9px 10px;
      }

      .map-info {
        display: none;
      }

      .reset-btn {
        right: 12px;
        bottom: 18px;
        padding: 10px 13px;
      }
    }
  </style>
</head>

  <div class="app">
    <aside class="sidebar">
      <div class="header">
        <div class="header-icon">📍</div>
        <div>
          <h1>동민게시판 현황</h1>
          <div class="sub">부산광역시 동구</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">총 개소</div>
          <div id="totalCount" class="stat-value">0</div>
        </div>
      </div>

      <div class="list-header">
        <div class="list-title">상세 목록</div>
        <div class="badge">관리번호 기준</div>
      </div>

      <div id="locationList"></div>
    </aside>

    <main class="map-shell">
      <div class="map-info">
        <strong>클러스터링 활성</strong>

      </div>

      <button id="resetButton" class="reset-btn" type="button">전체 뷰 보기</button>
      <div id="map"></div>
    </main>
  </div>

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    const map = L.map("map", {
      zoomControl: false,
      preferCanvas: true
    });

    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 45,
      zoomToBoundsOnClick: true,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      disableClusteringAtZoom: 18,
      chunkedLoading: true
    });

    const icon = L.divIcon({
      className: "board-icon",
      html: '<div class="board-pin"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -10]
    });

    const list = document.getElementById("locationList");
    const totalCount = document.getElementById("totalCount");
    totalCount.textContent = boardData.length;

    const markerPairs = [];
    const latLngs = [];

    boardData.forEach((board) => {
      const latLng = L.latLng(board.lat, board.lon);
      latLngs.push(latLng);

      const marker = L.marker(latLng, {
        icon,
        title: `${board.id} - ${board.location}`
      });

      marker.bindPopup(`
        <div class="popup-id">${escapeHtml(board.id)}</div>
        <div class="popup-location">${escapeHtml(board.location)}</div>
      `);

      clusterGroup.addLayer(marker);
      markerPairs.push({ board, marker });

      const button = document.createElement("button");
      button.type = "button";
      button.className = "list-item";
      button.innerHTML = `
        <div class="list-id">${escapeHtml(board.id)}</div>
        <div class="list-location">${escapeHtml(board.location)}</div>
      `;

      button.addEventListener("click", () => {
        clusterGroup.zoomToShowLayer(marker, () => {
          map.panTo(marker.getLatLng(), { animate: true });
          marker.openPopup();
        });
      });

      list.appendChild(button);
    });

    map.addLayer(clusterGroup);

    const allBounds = L.latLngBounds(latLngs);

    function fitAll(animate = false) {
      map.invalidateSize(true);
      map.fitBounds(allBounds, {
        padding: [28, 28],
        animate
      });
      map.closePopup();
    }

    document.getElementById("resetButton").addEventListener("click", () => fitAll(true));

    // GitHub Pages/CDN 환경에서 컨테이너 크기가 확정된 다음 다시 계산.
    requestAnimationFrame(() => {
      map.invalidateSize(true);
      fitAll(false);
    });

    setTimeout(() => {
      map.invalidateSize(true);
      fitAll(false);
    }, 500);

    // 사이드바/화면 크기 변화에도 타일 재계산.
    const resizeObserver = new ResizeObserver(() => {
      map.invalidateSize(false);
    });
    resizeObserver.observe(document.querySelector(".map-shell"));

    window.addEventListener("orientationchange", () => {
      setTimeout(() => map.invalidateSize(true), 250);
    });
  </script>
